<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stanbax Schools Ibadan</title>
    <meta name="description" content="Official portal and learning platform for Stanbax Schools Ibadan, featuring academic programs, faculty, student testimonials, and admissions." />
    <meta property="og:title" content="Stanbax Schools Ibadan" />
    <meta property="og:description" content="Official portal and learning platform for Stanbax Schools Ibadan, featuring academic programs, faculty, student testimonials, and admissions." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Nunito:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module">
      const URL_KEY = "stanbax_supabase_url";
      const ANON_KEY = "stanbax_supabase_anon_key";
      let sharedConfig = null;

      try {
        const response = await fetch("/api/config", { cache: "no-store", signal: AbortSignal.timeout(6000) });
        if (response.ok) sharedConfig = await response.json();
      } catch (error) {
        console.warn("[Cloud Sync] Could not load shared configuration:", error);
      }

      const url = String(sharedConfig?.url || localStorage.getItem(URL_KEY) || "").trim().replace(/\/+$/, "");
      const anonKey = String(sharedConfig?.anonKey || localStorage.getItem(ANON_KEY) || "").trim();
      const lastLocalWrite = new Map();
      const originalSetItem = localStorage.setItem.bind(localStorage);
      localStorage.setItem = (key, value) => {
        lastLocalWrite.set(key, Date.now());
        originalSetItem(key, value);
      };

      if (url && anonKey) {
        localStorage.setItem(URL_KEY, url);
        localStorage.setItem(ANON_KEY, anonKey);
        try {
          const headers = {
            apikey: anonKey,
            Authorization: `Bearer ${anonKey}`,
          };
          const sessionToken = localStorage.getItem("stanbax_db_session");
          if (sessionToken) headers["x-stanbax-session"] = sessionToken;
          const response = await fetch(`${url}/rest/v1/school_state?select=key,data`, {
            headers,
            cache: "no-store",
            signal: AbortSignal.timeout(8000),
          });
          if (response.ok) {
            const rows = await response.json();
            // Session, auth, password and routing state is DEVICE-LOCAL. It must
            // never be hydrated from the shared database, otherwise every browser
            // inherits the last admin's session flags and lands in the admin portal.
            const hydrateSkip = new Set(["stanbax_db_session","stanbax_supabase_url","stanbax_supabase_anon_key","stanbax_active_section","stanbax_active_admin_id","stanbax_student_id","stanbax_tutor_id","stanbax_moderator_id","stanbax_parent_id","stanbax_resume_section"]);
            const isAuthStateKey = key => key.startsWith("stanbax_") && (key.endsWith("_auth") || key.endsWith("_password"));
            for (const row of rows) {
              if (!row || typeof row.key !== "string" || row.data === null || row.data === undefined) continue;
              if (hydrateSkip.has(row.key) || isAuthStateKey(row.key)) continue;
              if (row.key === "stanbax_students") {
                // The app merges cloud and local rosters itself; never let a smaller
                // cloud list clobber a larger local one before that merge can run.
                try {
                  const localStudents = JSON.parse(localStorage.getItem("stanbax_students") || "null");
                  if (Array.isArray(localStudents) && localStudents.length > 0) continue;
                } catch (mergeGuardError) { /* fall through and hydrate */ }
              }
              localStorage.setItem(row.key, JSON.stringify(row.data));
            }
          } else {
            console.warn("[Cloud Sync] Shared state read failed:", response.status);
          }
        } catch (error) {
          console.warn("[Cloud Sync] Shared state could not be loaded:", error);
        }
      }

      // Older builds cached plaintext passwords inside the student profile object.
      // Keep the app's existing profile cache usable, but scrub those legacy fields.
      const scrubStudentPassword = student => {
        if (!student || typeof student !== "object" || !Object.prototype.hasOwnProperty.call(student, "password")) return student;
        return { ...student, password: "[Password managed securely]" };
      };
      try {
        const students = JSON.parse(localStorage.getItem("stanbax_students") || "null");
        if (Array.isArray(students)) {
          originalSetItem("stanbax_students", JSON.stringify(students.map(scrubStudentPassword)));
        }
        const activeStudent = JSON.parse(sessionStorage.getItem("stanbax_active_student_cache") || "null");
        if (activeStudent && typeof activeStudent === "object") {
          sessionStorage.setItem("stanbax_active_student_cache", JSON.stringify(scrubStudentPassword(activeStudent)));
        }
      } catch (error) {
        console.warn("[Account Security] Could not scrub a legacy cached student password field:", error);
      }

      const activeDbSession = localStorage.getItem("stanbax_db_session") || sessionStorage.getItem("stanbax_db_session");
      const authHeaders = token => ({
        apikey: anonKey,
        Authorization: `Bearer ${anonKey}`,
        "Content-Type": "application/json",
        "x-stanbax-session": token,
      });
      const showFirstLoginPasswordGate = token => {
        const overlay = document.createElement("div");
        overlay.setAttribute("role", "dialog");
        overlay.setAttribute("aria-modal", "true");
        overlay.setAttribute("aria-labelledby", "first-login-title");
        overlay.style.cssText = "position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:18px;background:linear-gradient(145deg,#0b1635,#172554);font-family:Nunito,system-ui,sans-serif;color:#0f172a;";
        const card = document.createElement("section");
        card.style.cssText = "width:min(460px,100%);box-sizing:border-box;padding:26px 22px;border-radius:20px;background:#fff;box-shadow:0 24px 70px #02061799;";
        const title = document.createElement("h1");
        title.id = "first-login-title";
        title.textContent = "Set your new password";
        title.style.cssText = "margin:0 0 8px;color:#172554;font-size:22px;font-weight:900;";
        const help = document.createElement("p");
        help.textContent = "For account security, choose a new password before continuing to your student account. Use at least 8 characters.";
        help.style.cssText = "margin:0 0 18px;color:#475569;font-size:14px;line-height:1.55;";
        const form = document.createElement("form");
        form.style.cssText = "display:grid;gap:12px;";
        const makePasswordField = (labelText, name) => {
          const label = document.createElement("label");
          label.style.cssText = "display:grid;gap:6px;color:#334155;font-size:13px;font-weight:800;";
          label.append(document.createTextNode(labelText));
          const input = document.createElement("input");
          input.type = "password";
          input.name = name;
          input.required = true;
          input.minLength = 8;
          input.autocomplete = "new-password";
          input.style.cssText = "width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font:500 16px system-ui,sans-serif;";
          label.append(input);
          return input;
        };
        const newPassword = makePasswordField("New password", "new-password");
        const confirmPassword = makePasswordField("Confirm new password", "confirm-password");
        const error = document.createElement("p");
        error.setAttribute("role", "alert");
        error.style.cssText = "display:none;margin:0;color:#b91c1c;font-size:13px;line-height:1.4;";
        const submit = document.createElement("button");
        submit.type = "submit";
        submit.textContent = "Update password and continue";
        submit.style.cssText = "margin-top:4px;border:0;border-radius:11px;padding:13px;background:#1e3a8a;color:#fff;font:900 14px Nunito,system-ui,sans-serif;cursor:pointer;";
        form.append(newPassword.parentElement, confirmPassword.parentElement, error, submit);
        form.addEventListener("submit", async event => {
          event.preventDefault();
          error.style.display = "none";
          const next = newPassword.value.trim();
          const confirm = confirmPassword.value.trim();
          if (next.length < 8) {
            error.textContent = "Use a password with at least 8 characters.";
            error.style.display = "block";
            return;
          }
          if (next !== confirm) {
            error.textContent = "The passwords do not match.";
            error.style.display = "block";
            return;
          }
          submit.disabled = true;
          submit.textContent = "Updating securely…";
          try {
            const response = await fetch(`${url}/rest/v1/rpc/complete_first_login_password_change`, {
              method: "POST",
              headers: authHeaders(token),
              body: JSON.stringify({ p_new_password: next, p_confirm_password: confirm }),
              signal: AbortSignal.timeout(15000),
            });
            const result = await response.json().catch(() => null);
            if (!response.ok || result?.ok !== true) throw new Error(result?.message || `Password update failed (HTTP ${response.status}).`);

            // Refresh only the masked Admin-facing student profile. The typed password
            // is sent to the RPC body and is never written to localStorage/sessionStorage.
            const profileResponse = await fetch(`${url}/rest/v1/school_state?select=key,data&key=eq.stanbax_students`, {
              headers: authHeaders(token), cache: "no-store", signal: AbortSignal.timeout(8000),
            });
            if (profileResponse.ok) {
              const [profileRow] = await profileResponse.json();
              if (profileRow?.data !== undefined) {
                const oldValue = localStorage.getItem("stanbax_students");
                const newValue = JSON.stringify(profileRow.data);
                originalSetItem("stanbax_students", newValue);
                window.dispatchEvent(new StorageEvent("storage", {
                  key: "stanbax_students", oldValue, newValue,
                  storageArea: localStorage, url: window.location.href,
                }));
              }
            }
            newPassword.value = "";
            confirmPassword.value = "";
            overlay.remove();
          } catch (cause) {
            error.textContent = cause?.message || "Could not update your password. Check your connection and try again.";
            error.style.display = "block";
            submit.disabled = false;
            submit.textContent = "Update password and continue";
          }
        });
        card.append(title, help, form);
        overlay.append(card);
        document.body.append(overlay);
        setTimeout(() => newPassword.focus(), 0);
      };
      if (url && anonKey && activeDbSession) {
        try {
          const statusResponse = await fetch(`${url}/rest/v1/rpc/get_password_change_status`, {
            method: "POST",
            headers: authHeaders(activeDbSession),
            body: "{}",
            cache: "no-store",
            signal: AbortSignal.timeout(7000),
          });
          const status = await statusResponse.json().catch(() => null);
          if (statusResponse.ok && status?.ok === true && status.role === "student" && status.required === true) {
            showFirstLoginPasswordGate(activeDbSession);
          }
        } catch (error) {
          console.warn("[Account Security] First-login status could not be checked:", error);
        }
      }

      await import("/assets/index-4636fcc4.js");
      await import("/assets/chat-realtime-bridge.js");

      const summaryStateKey = "stanbax_student_summary_display";
      const summaryDefinitions = [
        { key: "average", label: "Collated Average" },
        { key: "standing", label: "Class Standing" },
        { key: "gpa", label: "Cumulative GPA" },
        { key: "status", label: "Standing / Status" },
      ];
      const defaultSummaryPreferences = () => ({
        visible: true,
        cards: Object.fromEntries(summaryDefinitions.map(item => [item.key, { visible: true, label: item.label }])),
      });
      const readSummaryPreferences = () => {
        try {
          const saved = JSON.parse(localStorage.getItem(summaryStateKey) || "null");
          return {
            ...defaultSummaryPreferences(),
            ...(saved && typeof saved === "object" ? saved : {}),
            cards: Object.fromEntries(summaryDefinitions.map(item => [item.key, {
              visible: saved?.cards?.[item.key]?.visible !== false,
              label: typeof saved?.cards?.[item.key]?.label === "string" ? saved.cards[item.key].label : item.label,
            }])),
          };
        } catch { return defaultSummaryPreferences(); }
      };
      const findSummaryCards = () => {
        const preferences = readSummaryPreferences();
        const found = {};
        for (const item of summaryDefinitions) {
          const labels = new Set([item.label, preferences.cards[item.key].label].map(value => value.trim().toLowerCase()));
          const labelNode = Array.from(document.querySelectorAll("span")).find(node => labels.has((node.textContent || "").trim().toLowerCase()));
          if (!labelNode) continue;
          let card = labelNode.parentElement;
          while (card && !(card.tagName === "DIV" && card.classList.contains("bg-white"))) card = card.parentElement;
          if (card) found[item.key] = { card, labelNode };
        }
        const entries = Object.values(found);
        const group = entries.length ? entries[0].card.parentElement : null;
        if (!group || entries.length !== summaryDefinitions.length || entries.some(entry => entry.card.parentElement !== group)) return null;
        return { group, found };
      };
      const applySummaryPreferences = () => {
        const summary = findSummaryCards();
        if (!summary) return;
        const preferences = readSummaryPreferences();
        summary.group.style.display = preferences.visible ? "" : "none";
        for (const item of summaryDefinitions) {
          const entry = summary.found[item.key];
          entry.card.style.display = preferences.cards[item.key].visible ? "" : "none";
          if (entry.labelNode.textContent !== preferences.cards[item.key].label) {
            entry.labelNode.textContent = preferences.cards[item.key].label;
          }
        }
      };
      const adminCanManageSummary = () => Boolean(
        document.querySelector('[data-stanbax-admin-portal="true"]') &&
        (localStorage.getItem("stanbax_admin_auth") === "true" || sessionStorage.getItem("stanbax_admin_auth") === "true")
      );
      let adminSettingsTabActive = false;
      const adminSettingsToolsHostId = "stanbax-admin-school-settings-tools";
      const getAdminSettingsActionsHost = () => {
        if (!adminCanManageSummary() || !adminSettingsTabActive) return null;
        const portal = document.querySelector('[data-stanbax-admin-portal="true"]');
        const main = portal?.querySelector("main");
        if (!portal || !main) return null;

        let section = portal.querySelector('[data-stanbax-settings-tools="true"]');
        if (!section) {
          section = document.createElement("section");
          section.dataset.stanbaxSettingsTools = "true";
          section.setAttribute("aria-label", "School Settings & Signatures admin controls");
          section.style.cssText = "display:grid;gap:8px;margin:0 0 22px;padding:14px;border:1px solid #f1d28a;border-radius:16px;background:#fffbeb;box-shadow:0 4px 12px #78350f10;";
          const heading = document.createElement("strong");
          heading.textContent = "School-wide controls";
          heading.style.cssText = "color:#78350f;font:800 14px Nunito,system-ui,sans-serif;";
          const description = document.createElement("p");
          description.textContent = "Student password requirements and student summary display settings.";
          description.style.cssText = "margin:0;color:#57534e;font:500 12px/1.5 Nunito,system-ui,sans-serif;";
          const actions = document.createElement("div");
          actions.dataset.stanbaxSettingsActions = "true";
          actions.style.cssText = "display:flex;flex-wrap:wrap;align-items:flex-start;gap:9px;";
          section.append(heading, description, actions);
        }
        if (section.parentElement !== main) main.prepend(section);
        return section.querySelector('[data-stanbax-settings-actions="true"]');
      };
      const summaryAdminControlId = "stanbax-summary-schoolwide-admin";
      const installAdminSummaryControl = () => {
        let control = document.getElementById(summaryAdminControlId);
        if (!adminCanManageSummary() || !adminSettingsTabActive) {
          control?.remove();
          document.getElementById(adminSettingsToolsHostId)?.remove();
          return;
        }
        const actionsHost = getAdminSettingsActionsHost();
        if (!actionsHost) {
          control?.remove();
          return;
        }
        if (control?.isConnected) return;

        control = document.createElement("aside");
        control.id = summaryAdminControlId;
        control.style.cssText = "position:relative;z-index:1;flex-basis:100%;width:100%;font:600 14px Nunito,system-ui,sans-serif;color:#0f172a;";
        const openButton = document.createElement("button");
        openButton.type = "button";
        openButton.textContent = "Student summary display";
        openButton.style.cssText = "border:1px solid #fbbf24;border-radius:999px;padding:10px 14px;background:#1e3a8a;color:#fff;font:800 13px Nunito,system-ui,sans-serif;box-shadow:0 4px 12px #0f172a22;cursor:pointer;";
        const panel = document.createElement("section");
        panel.setAttribute("aria-label", "School-wide student summary display settings");
        panel.style.cssText = "display:none;position:relative;width:min(390px,100%);max-height:60vh;overflow:auto;box-sizing:border-box;margin-top:10px;padding:16px;border:1px solid #cbd5e1;border-radius:16px;background:#fff;box-shadow:0 8px 24px #0f172a22;";
        const heading = document.createElement("strong");
        heading.textContent = "School-wide student summary";
        heading.style.cssText = "display:block;font-size:16px;color:#172554;margin-bottom:4px;";
        const description = document.createElement("p");
        description.textContent = "These settings are saved to the shared school database and apply to every student browser.";
        description.style.cssText = "margin:0 0 12px;color:#475569;font-size:12px;line-height:1.5;";
        const fields = document.createElement("div");
        fields.style.cssText = "display:grid;gap:5px;";
        const status = document.createElement("p");
        status.setAttribute("role", "status");
        status.style.cssText = "min-height:18px;margin:8px 0;color:#475569;font-size:12px;";
        const saveButton = document.createElement("button");
        saveButton.type = "button";
        saveButton.textContent = "Save for all users";
        saveButton.style.cssText = "width:100%;border:0;border-radius:10px;padding:10px;background:#1e3a8a;color:#fff;font:800 14px Nunito,system-ui,sans-serif;cursor:pointer;";
        const resetButton = document.createElement("button");
        resetButton.type = "button";
        resetButton.textContent = "Reset to defaults";
        resetButton.style.cssText = "width:100%;margin-top:7px;border:1px solid #cbd5e1;border-radius:10px;padding:9px;background:#f8fafc;color:#1e293b;font:700 13px Nunito,system-ui,sans-serif;cursor:pointer;";
        panel.append(heading, description, fields, status, saveButton, resetButton);
        openButton.addEventListener("click", () => {
          const show = panel.style.display === "none";
          panel.style.display = show ? "block" : "none";
          if (show) renderAdminFields();
        });
        control.append(panel, openButton);
        actionsHost.append(control);

        const addCheckbox = (labelText, checked, key) => {
          const label = document.createElement("label");
          label.style.cssText = "display:flex;align-items:center;gap:9px;padding:7px 2px;color:#1e293b;cursor:pointer;";
          const input = document.createElement("input");
          input.type = "checkbox";
          input.dataset.preference = key;
          input.checked = checked;
          label.append(input, document.createTextNode(labelText));
          fields.append(label);
        };
        const renderAdminFields = () => {
          const preferences = readSummaryPreferences();
          fields.replaceChildren();
          addCheckbox("Show the summary section", preferences.visible, "visible");
          for (const item of summaryDefinitions) {
            addCheckbox(`Show ${item.label}`, preferences.cards[item.key].visible, `${item.key}.visible`);
            const label = document.createElement("label");
            label.style.cssText = "display:grid;gap:4px;padding:0 0 8px 27px;color:#475569;font-size:12px;";
            label.append(document.createTextNode(`${item.label} label`));
            const input = document.createElement("input");
            input.type = "text";
            input.maxLength = 32;
            input.dataset.preference = `${item.key}.label`;
            input.value = preferences.cards[item.key].label;
            input.style.cssText = "width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px;padding:8px 9px;font:500 14px Nunito,system-ui,sans-serif;";
            label.append(input);
            fields.append(label);
          }
        };
        saveButton.addEventListener("click", async () => {
          const next = defaultSummaryPreferences();
          next.visible = fields.querySelector('[data-preference="visible"]')?.checked !== false;
          for (const item of summaryDefinitions) {
            next.cards[item.key].visible = fields.querySelector(`[data-preference="${item.key}.visible"]`)?.checked !== false;
            const value = fields.querySelector(`[data-preference="${item.key}.label"]`)?.value?.trim();
            next.cards[item.key].label = (value || item.label).slice(0, 32);
          }
          const token = localStorage.getItem("stanbax_db_session") || sessionStorage.getItem("stanbax_db_session");
          if (!token) {
            status.textContent = "Admin cloud session not found. Sign out and back in, then try again.";
            status.style.color = "#b91c1c";
            return;
          }
          saveButton.disabled = true;
          status.textContent = "Saving shared setting…";
          status.style.color = "#475569";
          try {
            const response = await fetch(`${url}/rest/v1/rpc/put_states`, {
              method: "POST",
              headers: {
                apikey: anonKey,
                Authorization: `Bearer ${anonKey}`,
                "Content-Type": "application/json",
                "x-stanbax-session": token,
              },
              body: JSON.stringify({ p_items: [{ key: summaryStateKey, data: next }] }),
              signal: AbortSignal.timeout(10000),
            });
            if (!response.ok) throw new Error((await response.text()).slice(0, 240) || `HTTP ${response.status}`);
            originalSetItem(summaryStateKey, JSON.stringify(next));
            window.dispatchEvent(new StorageEvent("storage", {
              key: summaryStateKey,
              oldValue: null,
              newValue: JSON.stringify(next),
              storageArea: localStorage,
              url: window.location.href,
            }));
            applySummaryPreferences();
            status.textContent = "Saved to the school database. It will apply to all users.";
            status.style.color = "#047857";
          } catch (error) {
            status.textContent = `Could not save: ${error?.message || "Cloud request failed."}`;
            status.style.color = "#b91c1c";
          } finally {
            saveButton.disabled = false;
          }
        });
        resetButton.addEventListener("click", () => {
          fields.querySelector('[data-preference="visible"]').checked = true;
          for (const item of summaryDefinitions) {
            fields.querySelector(`[data-preference="${item.key}.visible"]`).checked = true;
            fields.querySelector(`[data-preference="${item.key}.label"]`).value = item.label;
          }
          status.textContent = "Defaults selected. Choose Save for all users to publish them.";
          status.style.color = "#475569";
        });
        renderAdminFields();
      };
      const passwordChangeControlId = "stanbax-admin-force-password-change";
      const installAdminPasswordChangeControl = () => {
        let button = document.getElementById(passwordChangeControlId);
        if (!adminCanManageSummary() || !adminSettingsTabActive) {
          button?.remove();
          document.getElementById(adminSettingsToolsHostId)?.remove();
          return;
        }
        const actionsHost = getAdminSettingsActionsHost();
        if (!actionsHost) {
          button?.remove();
          return;
        }
        if (button?.isConnected) return;

        button = document.createElement("button");
        button.id = passwordChangeControlId;
        button.type = "button";
        button.textContent = "Require password change";
        button.setAttribute("aria-label", "Require a student's password to be changed at next sign-in");
        button.title = "Require a selected student to change password at their next sign-in";
        button.style.cssText = "border:1px solid #fbbf24;border-radius:999px;padding:10px 14px;background:#b91c1c;color:#fff;font:800 13px Nunito,system-ui,sans-serif;box-shadow:0 4px 12px #0f172a22;cursor:pointer;";
        button.addEventListener("click", async () => {
          const identifier = window.prompt("Enter the student's exact registration number, login ID, or Student ID:");
          const cleanIdentifier = identifier?.trim();
          if (!cleanIdentifier) return;
          if (!window.confirm(`Require ${cleanIdentifier} to set a new password at their next sign-in?`)) return;

          const token = localStorage.getItem("stanbax_db_session") || sessionStorage.getItem("stanbax_db_session");
          if (!url || !anonKey || !token) {
            window.alert("A Supabase admin session is required. Sign out and back into the Admin Portal, then try again.");
            return;
          }

          button.disabled = true;
          button.textContent = "Saving to Supabase…";
          try {
            const response = await fetch(`${url}/rest/v1/rpc/admin_require_student_password_change`, {
              method: "POST",
              headers: authHeaders(token),
              body: JSON.stringify({ p_identifier: cleanIdentifier }),
              cache: "no-store",
              signal: AbortSignal.timeout(12000),
            });
            const result = await response.json().catch(() => null);
            if (!response.ok || result?.ok !== true) {
              throw new Error(result?.message || `Supabase request failed (HTTP ${response.status}).`);
            }
            await refreshSharedState();
            window.alert(`${result.message || "The password change is required at next sign-in."}\nStudent: ${result.identifier || cleanIdentifier}`);
          } catch (error) {
            window.alert(`Could not update Supabase: ${error?.message || "Connection failed."}\nRun admin_force_student_password_change.sql in the Supabase SQL Editor if this RPC is not installed.`);
          } finally {
